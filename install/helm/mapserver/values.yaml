# Default values for the OlleBo mapserver Helm chart.

image:
  repository: ghcr.io/ollebo/mapserver
  # Empty means the chart's appVersion, so a chart release always runs the
  # image it was published with.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

# Pairing with an ollebo.com space. `key` is stored in a Secret.
# `spaceId` and `apiUrl` live in a ConfigMap.
ollebo:
  # The key from the mapserver you created at ollebo.com. It decides which Space
  # your maps appear in.
  key: ""
  spaceId: local
  apiUrl: https://www.ollebo.com/api

terracotta:
  # Browser-facing tile URL. Must be reachable from any viewer (including
  # ollebo.com). When ingress.enabled=true, set this to https://<ingress.host>,
  # with no path.
  publicUrl: http://localhost:5001
  dbPath: /data/db/terracotta.sqlite
  provider: sqlite
  # Web pages allowed to load tiles. Terracotta's default is localhost only,
  # which makes the ollebo.com dashboards fail with a CORS error.
  allowedOrigins:
    - https://dash.ollebo.com
    - https://dash.northamlin.com

# One Service exposes both container ports.
service:
  type: ClusterIP
  flaskPort: 8080
  terracottaPort: 5000

# Optional public Ingress. It publishes the tile routes only. The web UI has no
# login and can upload files and show the map key, so it stays private unless
# you set exposeUi=true, and then only behind your own authentication.
ingress:
  enabled: false
  className: ""
  host: tiles.example.com
  tlsSecret: ""
  annotations: {}
  exposeUi: false
  paths:
    flask: /
    terracotta:
      - /rgb
      - /singleband

# Three independent PVCs back the three data directories.
persistence:
  maps:
    size: 20Gi
    storageClassName: ""
    accessMode: ReadWriteOnce
  cogs:
    size: 50Gi
    storageClassName: ""
    accessMode: ReadWriteOnce
  db:
    size: 1Gi
    storageClassName: ""
    accessMode: ReadWriteOnce

resources:
  flask:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  terracotta:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext: {}
securityContext: {}
